# qmllint settings for Aroli Desktop.
#
# CI runs on Ubuntu noble (Qt 6.4), where Quickshell and QtQuick.Effects
# cannot resolve: they are not packaged there, and Quickshell types only
# exist on Arch. Semantic warnings are therefore informational, so the CI
# gate checks syntactic validity (syntax errors are still errors and fail
# the run). For the full semantic check, run qmllint locally on Arch with
# Quickshell installed.
[General]
DisableDefaultImports=false

[Warnings]
BadSignalHandler=info
Deprecated=info
ImportFailure=info
InheritanceCycle=info
MultilineStrings=info
PropertyAlias=info
RequiredProperty=info
TypeError=info
UnknownProperty=info
UnqualifiedAccess=info
UnusedImports=info
WithStatement=info
