name: release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Tag matches VERSION
        run: |
          tag="${GITHUB_REF_NAME#v}"
          ver="$(tr -d ' \t\r\n' < VERSION)"
          [ "$tag" = "$ver" ] || { echo "tag v$tag != VERSION $ver"; exit 1; }
      - name: Shell syntax
        run: |
          bash -n install.sh
          bash -n diagnose
          bash -n home/.local/bin/rice
          bash -n scripts/migrate-from-legacy-rice.sh
      - uses: actions/setup-go@v5
        with:
          go-version: "1.27.x"
      - name: Go CLI
        run: go test ./...
      - name: Generate and verify delivery manifest
        run: |
          ./scripts/generate-manifest.sh manifest.json
          git diff --exit-code -- manifest.json
      - name: Installer dry-run plan
        run: |
          # install.sh targets Arch; outside Arch only the arg parsing and
          # preflight are exercised. This still catches quoting/syntax slips.
          bash install.sh --help >/dev/null
      - name: i18n dictionaries
        run: python3 home/.config/quickshell/tools/i18n-check.py

  release:
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version: "1.27.x"
      - name: Build CLI releases
        run: |
          for arch in amd64 arm64; do
            GOOS=linux GOARCH="$arch" go build -trimpath -ldflags "-s -w -X main.version=${GITHUB_REF_NAME}" -o "aroli-linux-$arch" ./cmd/aroli
            # Transition names so installers predating the aroli rename
            # (they fetch rice-linux-*) keep updating. Drop once no
            # supported release looks them up.
            cp "aroli-linux-$arch" "rice-linux-$arch"
          done
      - name: Checksums
        run: |
          ./scripts/generate-manifest.sh manifest.json
          git archive --format=tar.gz --prefix="aroli-desktop-${GITHUB_REF_NAME}/" \
            -o "aroli-desktop-${GITHUB_REF_NAME}.tar.gz" "$GITHUB_REF_NAME"
          sha256sum "aroli-desktop-${GITHUB_REF_NAME}.tar.gz" aroli-linux-amd64 aroli-linux-arm64 rice-linux-amd64 rice-linux-arm64 > SHA256SUMS.txt
      - name: Extract CHANGELOG entry
        run: |
          awk -v tag="[${GITHUB_REF_NAME#v}]" '
            $0 ~ "^## \\[" { capture = ($0 ~ "^## \\[" tag "\\]") }
            capture { print }
          ' CHANGELOG.md > RELEASE_NOTES.md
          [ -s RELEASE_NOTES.md ] || echo "See CHANGELOG.md for details." > RELEASE_NOTES.md
      - name: Publish release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          assets=(aroli-desktop-*.tar.gz SHA256SUMS.txt aroli-linux-amd64 aroli-linux-arm64 rice-linux-amd64 rice-linux-arm64)
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            while IFS= read -r asset; do
              [ -n "$asset" ] || continue
              gh release delete-asset "$GITHUB_REF_NAME" "$asset" --yes
            done < <(gh release view "$GITHUB_REF_NAME" --json assets --jq '.assets[].name')
            gh release upload "$GITHUB_REF_NAME" "${assets[@]}" --clobber
            gh release edit "$GITHUB_REF_NAME" --draft=false --prerelease=false --notes-file RELEASE_NOTES.md
          else
            gh release create "$GITHUB_REF_NAME" "${assets[@]}" \
              --title "$GITHUB_REF_NAME" --notes-file RELEASE_NOTES.md
          fi
