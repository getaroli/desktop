name: Promotion gate

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  promotion-tag:
    name: Promotion tag
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Require a reachable SemVer release tag
        run: |
          if ! tag="$(git tag --merged HEAD --list | grep -Ex 'v[0-9]+\.[0-9]+\.[0-9]+' | sort -V | tail -n 1)"; then
            tag=""
          fi
          [ -n "$tag" ] || { echo "No reachable stable vX.Y.Z release tag" >&2; exit 1; }
