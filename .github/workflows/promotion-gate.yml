name: Promotion gate

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  promotion-tag:
    name: Promotion tag
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Require a SemVer release tag on the promoted commit
        run: |
          git tag --points-at HEAD | grep -Ex 'v[0-9]+\.[0-9]+\.[0-9]+'
