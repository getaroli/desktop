name: Promotion gate

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  promotion-tag:
    name: Promotion tag
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Require a reachable SemVer release tag
        run: |
          tag="$(git describe --tags --match 'v[0-9]*.[0-9]*.[0-9]*' --abbrev=0 HEAD)"
          [[ "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
