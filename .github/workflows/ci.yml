name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  delivery:
    name: Delivery contract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Delivery and shell gates
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck qt6-declarative-dev-tools qml6-module-qtquick qml6-module-qtquick-controls qml6-module-qtquick-layouts
          ./scripts/verify-delivery.sh
          shellcheck -S error install.sh diagnose home/.local/bin/aroli-backend scripts/*.sh
          export PATH="$PATH:/usr/lib/qt6/bin:/usr/lib/x86_64-linux-gnu/qt6/bin"
          QMLLINT="$(command -v qmllint || command -v qml6lint)"
          [ -n "$QMLLINT" ] || { echo "qmllint/qml6lint not found in PATH ($PATH)"; exit 1; }
          # Warning levels come from .qmllint.ini at the repo root (auto-discovered
          # upwards from each file): semantic warnings are info because
          # Quickshell and QtQuick.Effects cannot resolve on noble's Qt 6.4,
          # so this gate checks syntactic validity. No version-specific CLI
          # flags: Qt 6.4 does not know --max-warnings/--bare semantics we need.
          find home/.config/quickshell -name '*.qml' -print0 | xargs -0 -r "$QMLLINT"
          python3 home/.config/quickshell/tools/i18n-check.py

  cli:
    name: Go CLI
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.27.x"
      - name: Format
        run: test -z "$(gofmt -l cmd/aroli)"
      - name: Unit tests and race detector
        run: go test -race ./...
      - name: Static analysis
        run: go vet ./...
      - name: Build
        run: go build ./cmd/aroli

  installer:
    name: Installer compatibility
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Shell syntax
        run: |
          bash -n install.sh
          bash -n diagnose
          bash -n home/.local/bin/aroli-backend
          bash -n scripts/sync-aroli-fonts.sh
      - name: Installer dry-run and shell interface
        run: |
          bash install.sh --help >/dev/null
          bash install.sh --dry-run packages >/dev/null
          bash scripts/test-installer-dry-run.sh

  dry-run-profiles:
    name: Dry-run profile (${{ matrix.profile }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        profile: [minimal, desktop, creator, gaming]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.27.x"
      - name: Exercise profile plan
        run: |
          mkdir -p .ci-bin
          printf '#!/usr/bin/env sh\nexit 0\n' > .ci-bin/pacman
          chmod +x .ci-bin/pacman
          PATH="$PWD/.ci-bin:$PATH" go run ./cmd/aroli profile install "${{ matrix.profile }}" --dry-run --yes

  container-install:
    name: Arch installer interface
    runs-on: ubuntu-latest
    container: archlinux:latest
    steps:
      - uses: actions/checkout@v4
      - name: Install minimal parser dependencies
        run: pacman -Syu --noconfirm bash coreutils findutils git
      - name: Validate installer help and dry-run parser
        run: |
          bash install.sh --help >/dev/null
          USER=runner bash install.sh --dry-run --yes config >/dev/null
          bash scripts/test-installer-dry-run.sh
