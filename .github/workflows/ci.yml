name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  delivery:
    name: Delivery contract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Delivery and shell gates
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck qt6-declarative-dev-tools
          ./scripts/verify-delivery.sh
          shellcheck -S error install.sh diagnose home/.local/bin/aroli-backend home/.local/bin/rice scripts/*.sh
          export PATH="$PATH:/usr/lib/qt6/bin:/usr/lib/x86_64-linux-gnu/qt6/bin"
          QMLLINT="$(command -v qmllint || command -v qml6lint)"
          [ -n "$QMLLINT" ] || { echo "qmllint/qml6lint not found in PATH ($PATH)"; exit 1; }
          find home/.config/quickshell -name '*.qml' -print0 | xargs -0 -r "$QMLLINT" --bare
          python3 home/.config/quickshell/tools/i18n-check.py

  cli:
    name: Go CLI
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.27.x"
      - name: Format
        run: test -z "$(gofmt -l cmd/aroli)"
      - name: Unit tests and race detector
        run: go test -race ./...
      - name: Static analysis
        run: go vet ./...
      - name: Build
        run: go build ./cmd/aroli

  installer:
    name: Installer compatibility
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Shell syntax
        run: |
          bash -n install.sh
          bash -n diagnose
          bash -n home/.local/bin/aroli-backend
          bash -n home/.local/bin/rice
          bash -n scripts/migrate-from-legacy-rice.sh
          bash -n scripts/sync-aroli-fonts.sh
      - name: Installer dry-run and shell interface
        run: |
          bash install.sh --help >/dev/null
          bash install.sh --dry-run packages >/dev/null

  dry-run-profiles:
    name: Dry-run profile (${{ matrix.profile }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        profile: [minimal, desktop, creator, gaming]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.27.x"
      - name: Exercise profile plan
        run: |
          mkdir -p .ci-bin
          printf '#!/usr/bin/env sh\nexit 0\n' > .ci-bin/pacman
          chmod +x .ci-bin/pacman
          PATH="$PWD/.ci-bin:$PATH" go run ./cmd/aroli profile install "${{ matrix.profile }}" --dry-run --yes

  container-install:
    name: Arch installer interface
    runs-on: ubuntu-latest
    container: archlinux:latest
    steps:
      - uses: actions/checkout@v4
      - name: Install minimal parser dependencies
        run: pacman -Syu --noconfirm bash coreutils findutils git
      - name: Validate installer help and dry-run parser
        run: |
          bash install.sh --help >/dev/null
          USER=runner bash install.sh --dry-run --yes config >/dev/null
